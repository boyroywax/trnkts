<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trnkts - Icon Library</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div id="statusMessage" class="status-message"></div>
    
    <div class="container">
        <a href="../index.html" class="home-button">
            <svg class="home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9,22 9,12 15,12 15,22"/>
            </svg>
            Back to Home
        </a>
        
        <div class="header">
            <h1 class="title">Icon Library</h1>
            <p class="subtitle">Beautiful dual-tone SVG icons with gradient support</p>
        </div>

        <div class="controls">
            <h2 class="controls-title">Customization Options</h2>
            
            <div class="control-row">
                <div class="control-group">
                    <label class="control-label">Icon Size (px)</label>
                    <input type="range" id="sizeSlider" class="control-input" min="24" max="128" value="64" oninput="updateSize(this.value)">
                    <div style="text-align: center; margin-top: 0.5rem; font-weight: 600;" id="sizeDisplay">64px</div>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Color Mode</label>
                    <div class="color-mode-selector">
                        <button class="color-mode active" onclick="setColorMode('gradient')">Gradient</button>
                        <button class="color-mode" onclick="setColorMode('mono')">Monochrome</button>
                        <button class="color-mode" onclick="setColorMode('custom')">Custom</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <label class="control-label">Custom Color</label>
                    <input type="color" id="customColor" class="control-input" value="#AF4B0E" onchange="updateCustomColor()">
                </div>
            </div>
            
            <div class="control-row">
                <div class="download-buttons">
                    <button class="download-btn" onclick="downloadAllIcons()">Download All Icons</button>
                    <button class="download-btn secondary" onclick="downloadCurrentCategory()">Download Category</button>
                </div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('interface')">Interface</div>
            <div class="tab" onclick="switchTab('system')">System</div>
            <div class="tab" onclick="switchTab('arrows')">Arrows</div>
            <div class="tab" onclick="switchTab('communication')">Communication</div>
            <div class="tab" onclick="switchTab('media')">Media</div>
            <div class="tab" onclick="switchTab('brand')">Brand</div>
            <div class="tab" onclick="switchTab('gems')" style="background: linear-gradient(135deg, #89CFF0, #A855F7); color: white; border-color: transparent;">Gems</div>
            <div class="tab" onclick="switchTab('prototypes')" style="background: linear-gradient(135deg, #833AB4, #E1306C); color: white; border-color: transparent;">Prototypes</div>
            <div class="tab" onclick="switchTab('interface-3d')" style="background: linear-gradient(135deg, #E1306C, #F77737); color: white; border-color: transparent;">Interface 3D</div>
            <div class="tab" onclick="switchTab('system-3d')" style="background: linear-gradient(135deg, #F77737, #FCAF45); color: white; border-color: transparent;">System 3D</div>
            <div class="tab" onclick="switchTab('communication-3d')" style="background: linear-gradient(135deg, #833AB4, #F77737); color: white; border-color: transparent;">Comm 3D</div>
            <div class="tab" onclick="switchTab('media-3d')" style="background: linear-gradient(135deg, #E1306C, #FCAF45); color: white; border-color: transparent;">Media 3D</div>
            <div class="tab" onclick="switchTab('navigation-3d')" style="background: linear-gradient(135deg, #F77737, #833AB4); color: white; border-color: transparent;">Nav 3D</div>
            <div class="tab" onclick="switchTab('web3-3d')" style="background: linear-gradient(135deg, #00E676, #7B68EE); color: white; border-color: transparent;">Web3 3D</div>
        </div>

        <div id="interface-grid" class="icon-grid"></div>
        <div id="system-grid" class="icon-grid" style="display: none;"></div>
        <div id="arrows-grid" class="icon-grid" style="display: none;"></div>
        <div id="communication-grid" class="icon-grid" style="display: none;"></div>
        <div id="media-grid" class="icon-grid" style="display: none;"></div>
        <div id="brand-grid" class="icon-grid" style="display: none;"></div>
        <div id="gems-grid" class="icon-grid" style="display: none;"></div>
        <div id="prototypes-grid" class="icon-grid" style="display: none;"></div>
        <div id="interface-3d-grid" class="icon-grid" style="display: none;"></div>
        <div id="system-3d-grid" class="icon-grid" style="display: none;"></div>
        <div id="communication-3d-grid" class="icon-grid" style="display: none;"></div>
        <div id="media-3d-grid" class="icon-grid" style="display: none;"></div>
        <div id="navigation-3d-grid" class="icon-grid" style="display: none;"></div>
        <div id="web3-3d-grid" class="icon-grid" style="display: none;"></div>
    </div>

    <!-- Import modular icon definitions -->
    <script src="icons/interface.js"></script>
    <script src="icons/system.js"></script>
    <script src="icons/arrows.js"></script>
    <script src="icons/communication.js"></script>
    <script src="icons/media.js"></script>
    <script src="icons/brand.js"></script>
    <script src="icons/gems.js"></script>
    <script src="icons/prototypes.js"></script>
    <script src="icons/interface-3d.js"></script>
    <script src="icons/system-3d.js"></script>
    <script src="icons/communication-3d.js"></script>
    <script src="icons/media-3d.js"></script>
    <script src="icons/navigation-3d.js"></script>
    <script src="icons/web3-3d.js"></script>

    <script>
        let currentColorMode = 'gradient';
        let currentSize = 64;
        let currentCategory = 'interface';

        // Combine all icon modules into the main library
        const iconLibrary = {
            interface: interfaceIcons,
            system: systemIcons,
            arrows: arrowIcons,
            communication: communicationIcons,
            media: mediaIcons,
            brand: brandIcons,
            gems: gemsIcons,
            prototypes: prototypeIcons,
            'interface-3d': interface3dIcons,
            'system-3d': system3dIcons,
            'communication-3d': communication3dIcons,
            'media-3d': media3dIcons,
            'navigation-3d': navigation3dIcons,
            'web3-3d': web3Icons
        };

        function createSVGIcon(iconData, size = 64, colorMode = 'gradient', previewMode = false) {
            const isPrototype = iconData.type === '3d-fill';
            const isWeb3Icon = iconData.type === 'web3-fill';
            const isWeb3Stroke = iconData.type === '3d-stroke';
            const isBitcoin = iconData.name === 'Bitcoin';
            let fills;
            
            // Use fixed 48px for preview cards, actual size for downloads
            const actualSize = previewMode ? 48 : size;
            
            // Create unique gradient ID to avoid conflicts
            const gradientId = `trnkts-gradient-${Math.random().toString(36).substr(2, 9)}`;
            
            switch (colorMode) {
                case 'gradient':
                    fills = [`url(#${gradientId})`, `url(#${gradientId})`, `url(#${gradientId})`];
                    break;
                case 'mono':
                    fills = ['#333333', '#555555', '#777777'];
                    break;
                case 'custom':
                    const customColor = document.getElementById('customColor')?.value || '#AF4B0E';
                    fills = [customColor, customColor + 'CC', customColor + '88'];
                    break;
                default:
                    fills = [`url(#${gradientId})`, `url(#${gradientId})`, `url(#${gradientId})`];
            }

            let svgContent = `<svg width="${actualSize}" height="${actualSize}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="${gradientId}" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#833AB4"/>
                        <stop offset="0.3" stop-color="#E1306C"/>
                        <stop offset="0.6" stop-color="#F77737"/>
                        <stop offset="1" stop-color="#FCAF45"/>
                    </linearGradient>
                    <filter id="glow-${Math.random().toString(36).substr(2, 9)}" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
                        <feMerge> 
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>`;

            if (isPrototype && iconData.paths) {
                // 3D Fill-based rendering for prototypes
                iconData.paths.forEach((pathData) => {
                    const fill = colorMode === 'gradient' ? `url(#${gradientId})` : fills[0];
                    const opacity = pathData.opacity || 1;
                    svgContent += `<path d="${pathData.d}" fill="${fill}" fill-opacity="${opacity}" stroke="none"/>`;
                });
            } else if (isWeb3Stroke && iconData.paths) {
                // Web3 stroke-based rendering with enhanced layering
                iconData.paths.forEach((path, index) => {
                    const fillColor = colorMode === 'gradient' ? `url(#${gradientId})` : fills[0];
                    
                    if (isBitcoin) {
                        // Bitcoin-specific Test 9D rendering
                        if (index === 0) {
                            // Outer circle - full fill
                            svgContent += `<path d="${path}" fill="${fillColor}" fill-opacity="1.0" stroke="none"/>`;
                        } else if (index === 1) {
                            // Inner circle - both fill and stroke for depth (like Test 9D)
                            svgContent += `<path d="${path}" fill="black" fill-opacity="0.2" stroke="white" stroke-width="1" stroke-opacity="0.3"/>`;
                        } else {
                            // All other paths are stroked details (B symbol parts)
                            svgContent += `<path d="${path}" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>`;
                        }
                    } else {
                        // Enhanced layering for other Web3 icons
                        if (index === 0) {
                            // Layer 0: Main shape - full gradient fill
                            svgContent += `<path d="${path}" fill="${fillColor}" fill-opacity="1.0" stroke="none"/>`;
                        } else if (index === 1) {
                            // Layer 1: Depth/shadow layer - semi-transparent overlay with rim highlight
                            svgContent += `<path d="${path}" fill="black" fill-opacity="0.2" stroke="white" stroke-width="1" stroke-opacity="0.3"/>`;
                        } else if (index === 2) {
                            // Layer 2: Secondary structural element - gradient with highlight
                            svgContent += `<path d="${path}" fill="${fillColor}" fill-opacity="0.85" stroke="white" stroke-width="0.5" stroke-opacity="0.4"/>`;
                        } else if (index === 3) {
                            // Layer 3: Tertiary structural element - medium gradient
                            svgContent += `<path d="${path}" fill="${fillColor}" fill-opacity="0.7" stroke="none"/>`;
                        } else if (index === 4) {
                            // Layer 4: Check if this is a token icon background circle
                            if (iconData.name === 'Token' && path.includes('M12 8c-2.21')) {
                                // Token background circle - use dark fill for contrast behind T symbol
                                svgContent += `<path d="${path}" fill="black" fill-opacity="0.3" stroke="none"/>`;
                            } else {
                                // Surface highlight - bright accent
                                svgContent += `<path d="${path}" fill="white" fill-opacity="1.0" stroke="none"/>`;
                            }
                        } else if (index === 5) {
                            // Layer 5: Check if this is the T symbol or edge highlight
                            if (iconData.name === 'Token' && path.includes('M6 6h12v3h-4.5v9h-3v-9H6V6z')) {
                                // Token T symbol - bright white
                                svgContent += `<path d="${path}" fill="white" fill-opacity="1.0" stroke="none"/>`;
                            } else {
                                // Edge/rim highlight
                                svgContent += `<path d="${path}" fill="none" stroke="white" stroke-width="1.2" stroke-opacity="0.6" stroke-linecap="round"/>`;
                            }
                        } else {
                            // Layer 6+: Detail elements
                            if (path.includes('M') && path.includes('L') && !path.includes('h') && !path.includes('v') && !path.includes('z')) {
                                // Line paths - use stroke
                                svgContent += `<path d="${path}" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none"/>`;
                            } else if (iconData.name === 'Token' && path.includes('M12 2.5C7.37')) {
                                // Token highlight arc - should be stroked, not filled
                                svgContent += `<path d="${path}" fill="none" stroke="white" stroke-width="1.2" stroke-opacity="0.6" stroke-linecap="round"/>`;
                            } else {
                                // Shape paths - use white fill
                                svgContent += `<path d="${path}" fill="white" fill-opacity="0.9" stroke="none"/>`;
                            }
                        }
                    }
                });
            } else if (isWeb3Stroke && iconData.layers) {
                // New layer-based rendering system
                iconData.layers.forEach((layer) => {
                    const fillColor = colorMode === 'gradient' ? `url(#${gradientId})` : fills[0];
                    
                    switch (layer.render) {
                        case 'main':
                            // Main shape - full gradient fill
                            svgContent += `<path d="${layer.path}" fill="${fillColor}" fill-opacity="1.0" stroke="none"/>`;
                            break;
                        case 'depth':
                            // Depth/shadow layer - semi-transparent overlay with rim highlight
                            svgContent += `<path d="${layer.path}" fill="black" fill-opacity="0.2" stroke="white" stroke-width="1" stroke-opacity="0.3"/>`;
                            break;
                        case 'secondary':
                            // Secondary structural element - gradient with highlight
                            svgContent += `<path d="${layer.path}" fill="${fillColor}" fill-opacity="0.85" stroke="white" stroke-width="0.5" stroke-opacity="0.4"/>`;
                            break;
                        case 'tertiary':
                            // Tertiary structural element - medium gradient
                            svgContent += `<path d="${layer.path}" fill="${fillColor}" fill-opacity="0.7" stroke="none"/>`;
                            break;
                        case 'background':
                            // Background circle - dark fill for contrast
                            svgContent += `<path d="${layer.path}" fill="black" fill-opacity="0.3" stroke="none"/>`;
                            break;
                        case 'symbol':
                            // Symbol elements - bright white (for Bitcoin use stroke, for Token use fill)
                            if (iconData.name === 'Bitcoin') {
                                svgContent += `<path d="${layer.path}" stroke="white" stroke-width="1.8" stroke-linecap="round" fill="none"/>`;
                            } else {
                                svgContent += `<path d="${layer.path}" fill="white" fill-opacity="1.0" stroke="none"/>`;
                            }
                            break;
                        case 'highlight':
                            // Highlight arc - stroked
                            svgContent += `<path d="${layer.path}" fill="none" stroke="white" stroke-width="1.2" stroke-opacity="0.6" stroke-linecap="round"/>`;
                            break;
                        case 'detail':
                            // Detail elements - white fill
                            svgContent += `<path d="${layer.path}" fill="white" fill-opacity="0.9" stroke="none"/>`;
                            break;
                        default:
                            // Fallback - basic white stroke
                            svgContent += `<path d="${layer.path}" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none"/>`;
                    }
                });
            } else if (isWeb3Icon && iconData.paths) {
                // Web3 icons - render with fill for all paths to show details
                iconData.paths.forEach((path, index) => {
                    const fillColor = colorMode === 'gradient' ? `url(#${gradientId})` : fills[0];
                    // Create better opacity layering for 3D effect
                    let opacity, strokeColor;
                    if (index === 0) {
                        opacity = 1.0;        // Main shape
                        strokeColor = 'none';
                    } else if (index === 1) {
                        opacity = 0.9;        // Secondary layer
                        strokeColor = 'none';
                    } else {
                        // For detail elements (B symbol, etc), use white fill for better contrast
                        opacity = 1.0;
                        strokeColor = 'none';
                    }
                    
                    // Use white fill for detail elements (index > 1) to ensure visibility
                    const actualFillColor = index > 1 ? 'white' : fillColor;
                    
                    svgContent += `<path d="${path}" fill="${actualFillColor}" fill-opacity="${opacity}" stroke="${strokeColor}"/>`;
                });
            } else if (iconData.paths && iconData.paths.length > 0) {
                // Dual-tone stroke-based rendering for existing icons
                svgContent += `<path d="${iconData.paths[0]}" stroke="${fills[0]}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="1.0"/>`;
                if (iconData.paths[1]) {
                    svgContent += `<path d="${iconData.paths[1]}" stroke="${fills[1]}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7"/>`;
                }
            }

            svgContent += '</svg>';
            return svgContent;
        }

        function renderIconGrid(containerId, iconCategory) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            Object.entries(iconLibrary[iconCategory]).forEach(([key, iconData]) => {
                const iconCard = document.createElement('div');
                iconCard.className = 'icon-card';
                iconCard.innerHTML = `
                    <div class="icon-preview">
                        ${createSVGIcon(iconData, 48, currentColorMode, true)}
                    </div>
                    <div class="icon-name">${iconData.name}</div>
                    <div class="icon-actions">
                        <button class="icon-button" onclick="copyToClipboard('${iconCategory}', '${key}')">Copy</button>
                        <button class="icon-button" onclick="downloadSingleIcon('${iconCategory}', '${key}')">Download</button>
                    </div>
                `;
                
                container.appendChild(iconCard);
            });
        }

        function setColorMode(mode) {
            currentColorMode = mode;
            document.querySelectorAll('.color-mode').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderCurrentCategory();
        }

        function updateSize(value) {
            currentSize = parseInt(value);
            document.getElementById('sizeDisplay').textContent = value + 'px';
        }

        function updateCustomColor() {
            if (currentColorMode === 'custom') {
                renderCurrentCategory();
            }
        }

        function switchTab(category) {
            // Hide all grids
            document.querySelectorAll('.icon-grid').forEach(grid => grid.style.display = 'none');
            
            // Show selected grid
            document.getElementById(category + '-grid').style.display = 'grid';
            
            // Update tab states
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            currentCategory = category;
            renderIconGrid(category + '-grid', category);
        }

        function renderCurrentCategory() {
            renderIconGrid(currentCategory + '-grid', currentCategory);
        }

        async function copyToClipboard(category, iconKey) {
            const iconData = iconLibrary[category][iconKey];
            const svgString = createSVGIcon(iconData, currentSize, currentColorMode);
            
            try {
                await navigator.clipboard.writeText(svgString);
                showStatus('Icon copied to clipboard!');
            } catch (err) {
                console.error('Failed to copy: ', err);
                showStatus('Failed to copy icon', 'error');
            }
        }

        function downloadSingleIcon(category, iconKey) {
            const iconData = iconLibrary[category][iconKey];
            const svgString = createSVGIcon(iconData, currentSize, currentColorMode);
            
            const blob = new Blob([svgString], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${iconKey}-${currentSize}px.svg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showStatus('Icon downloaded!');
        }

        async function downloadCurrentCategory() {
            const zip = new JSZip();
            const folder = zip.folder(currentCategory);
            
            Object.entries(iconLibrary[currentCategory]).forEach(([key, iconData]) => {
                const svgString = createSVGIcon(iconData, currentSize, currentColorMode);
                folder.file(`${key}-${currentSize}px.svg`, svgString);
            });
            
            const blob = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentCategory}-icons-${currentSize}px.zip`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showStatus('Category downloaded!');
        }

        async function downloadAllIcons() {
            const zip = new JSZip();
            
            Object.entries(iconLibrary).forEach(([categoryName, categoryIcons]) => {
                const folder = zip.folder(categoryName);
                Object.entries(categoryIcons).forEach(([key, iconData]) => {
                    const svgString = createSVGIcon(iconData, currentSize, currentColorMode);
                    folder.file(`${key}-${currentSize}px.svg`, svgString);
                });
            });
            
            const blob = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `trnkts-icons-${currentSize}px.zip`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showStatus('All icons downloaded!');
        }

        function showStatus(message, type = 'success') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message ${type}`;
            statusEl.classList.add('show');
            
            setTimeout(() => {
                statusEl.classList.remove('show');
            }, 3000);
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            renderIconGrid('interface-grid', 'interface');
        });
    </script>
</body>
</html>
